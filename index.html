
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUSO SUMMER ENGLISH ARENA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* Tăng font-size toàn trang: 16px → 18px (+2). Mọi class text-*/p-*... của
           Tailwind dùng rem nên tự scale theo tỷ lệ trên toàn bộ app. */
        html {
            font-size: 18px;
        }
        /* Desktop (≥640px): font tối thiểu 12px — nâng các cỡ hard-code 10/11px.
           Element đã khai báo sm:text-* riêng thì giữ theo biến thể đó (không đụng).
           Mobile (<640px) giữ nguyên 10/11px như thiết kế. */
        @media (min-width: 640px) {
            .text-\[10px\]:not([class*="sm:text-"]),
            .text-\[11px\]:not([class*="sm:text-"]) {
                font-size: 12px;
            }
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Navy Blue */
            color: white;
        }
        @keyframes floatUp {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            60%  { opacity: 1; transform: translateY(-40px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-70px) scale(0.8); }
        }
        .float-up {
            animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUpStreak {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            40%  { opacity: 1; transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.9); }
        }
        .float-up-streak {
            animation: floatUpStreak 1.0s ease-out forwards;
        }
        @keyframes streakPop {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.4); }
            70%  { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .streak-pop {
            animation: streakPop 0.4s ease-out forwards;
        }
        /* Handwriting font cho phần điền tay trên giấy chứng nhận */
        .font-handwriting {
            font-family: 'Caveat', 'Dancing Script', cursive;
            font-weight: 700;
        }
        /* Print: ẩn UI ngoài giấy chứng nhận */
        @media print {
            @page { size: A4 landscape; margin: 0; }
            html, body { background: #fff !important; color: #000 !important; }
            .no-print { display: none !important; }
            .cert-print {
                page-break-inside: avoid;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
