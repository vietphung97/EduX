# ============================================================
# postgrest.conf — cấu hình PostgREST cho EduX
# Chạy: .\postgrest.exe postgrest.conf
# ============================================================

# Mật khẩu phải khớp role authenticator trong 00_roles_and_auth_shim.sql
db-uri = "postgres://authenticator:DOI_MAT_KHAU_NAY@localhost:5432/edux"

db-schemas = "public"
db-anon-role = "anon"

# Secret ký JWT — tự đặt chuỗi ngẫu nhiên >= 32 ký tự,
# rồi dùng make_jwt.mjs sinh VITE_SUPABASE_ANON_KEY từ secret này.
jwt-secret = "DAT_CHUOI_BI_MAT_NGAU_NHIEN_IT_NHAT_32_KY_TU"

server-host = "127.0.0.1"
server-port = 3000

# Supabase cloud giới hạn 1000 dòng/query — giữ nguyên để
# hành vi leaderboard/history giống hệt hiện tại.
db-max-rows = 1000
